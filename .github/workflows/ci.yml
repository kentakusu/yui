# 結（yui）のテストを、push のたびに全部の土台で回します。
# public リポジトリなので、標準のランナーは無料です。
#
# ★土台ごとに違う挙動を捕まえるのが目的です。
#   実際にこれまで出たのは「Windows で UTF-8 のパスが開けない」
#   「Windows の argv は cp932 で来る」「wasm では排他が効かない」でした。
#   手元 1 台では出ません。
name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ枝に push が続いたら、古い回は止めます
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux（${{ matrix.cc }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: 作る
        run: make CC=${{ matrix.cc }}

      - name: テスト
        run: make test CC=${{ matrix.cc }}

      - name: テスト（AddressSanitizer / UBSan つき）
        run: make test-san CC=${{ matrix.cc }}

      - name: 土台をまたぐ比較用のファイルを作る
        if: matrix.cc == 'gcc'
        run: ./yui compat.yui < tests/compat.txt

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc'
        with:
          name: yui-linux
          path: compat.yui
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 作る
        run: make

      - name: テスト
        run: make test

      - name: テスト（AddressSanitizer / UBSan つき）
        run: make test-san

  windows:
    name: Windows（MSVC）
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: 作る
        run: .\build.bat

      - name: テスト
        run: .\build.bat test

      # ★ここだけ pwsh です。cmd はバッチファイルをその時のコードページで
      #   読むので、日本語を引数に書くには chcp が要ります。pwsh は UTF-8 で
      #   読み、引数も UTF-16 のまま渡すので、測りたいもの（本体が引数を
      #   UTF-8 で受け取れるか）だけを測れます。
      - name: 日本語を引数で渡せること（★cp932 の罠）
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          .\yui.exe argv.yui "作る (人:田中)"
          if ($LASTEXITCODE -ne 0) { throw "作る が失敗しました（rc=$LASTEXITCODE）" }
          $out = .\yui.exe argv.yui "探す 田中" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "探す が失敗しました（rc=$LASTEXITCODE）" }
          Write-Host $out
          if ($out -notmatch "人:田中") { throw "引数で渡した日本語が通っていません" }

      # ★tests/cli.sh と同じことを見ています（あちらは sh が要るので Windows で動きません）。
      #   片方を直したら、もう片方も直してください。
      - name: CLI の終了コードと標準入力の読み方
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          # 終了コード
          .\yui.exe 2>$null | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "引数が無いとき 2 を返しません（rc=$LASTEXITCODE）" }
          .\yui.exe cli.yui "一覧 ()" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "成功で 0 を返しません（rc=$LASTEXITCODE）" }
          .\yui.exe cli.yui "これは誤り" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "失敗で 1 を返しません（rc=$LASTEXITCODE）" }
          # 誤りの行があっても止まらず、何行目かを出す
          "作る (点:一)`nこれは誤り`n作る (点:三)" | Set-Content -Path in1.txt -Encoding utf8NoBOM
          $err = (Get-Content in1.txt -Raw | .\yui.exe cli2.yui) 2>&1 | Out-String
          if ($err -notmatch "2 行目") { throw "何行目で失敗したかが出ていません: $err" }
          $left = (.\yui.exe cli2.yui "一覧 (点:) 名前だけ" | Out-String)
          if ($left -notmatch "点:一" -or $left -notmatch "点:三") {
            throw "誤りの行の前後が実行されていません: $left"
          }
          # NUL が入った行は、その行だけ飛ばして次へ進む
          $b = [Text.Encoding]::UTF8.GetBytes('作る (点:甲 {本文: "x')
          $b += 0
          $b += [Text.Encoding]::UTF8.GetBytes("y`"})`n作る (点:乙)`n")
          [IO.File]::WriteAllBytes("$PWD\in2.txt", $b)
          $err = (Get-Content in2.txt -Raw | .\yui.exe cli3.yui) 2>&1 | Out-String
          if ($err -notmatch "NUL") { throw "NUL だと言っていません: $err" }
          if ($err -notmatch "1 行目") { throw "NUL のある行が出ていません: $err" }
          $left = (.\yui.exe cli3.yui "一覧 (点:) 名前だけ" | Out-String)
          if ($left -notmatch "点:乙") { throw "NUL の次の行が巻き込まれています: $left" }
          Write-Host "CLI: 通りました"

      - name: 土台をまたぐ比較用のファイルを作る
        run: type tests\compat.txt | .\yui.exe compat.yui

      - uses: actions/upload-artifact@v4
        with:
          name: yui-windows
          path: compat.yui
          if-no-files-found: error

  wasm:
    name: wasm（emscripten）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: emsdk を入れる
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install latest
          ./emsdk activate latest

      - name: テスト
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          make test-wasm

  compat:
    name: 土台をまたいでバイトまで同じか
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: yui-linux
          path: from-linux

      - uses: actions/download-artifact@v4
        with:
          name: yui-windows
          path: from-windows

      - name: 大きさと md5 を出す
        run: |
          ls -l from-linux/compat.yui from-windows/compat.yui
          md5sum from-linux/compat.yui from-windows/compat.yui

      - name: バイトを突き合わせる
        run: cmp from-linux/compat.yui from-windows/compat.yui

      # 日本語のファイル名も一緒に確かめます（README の例が 知識.yui なので）
      - name: Windows で書いたファイルを Linux の実装で読む
        run: |
          make
          cp from-windows/compat.yui 知識.yui
          ./yui 知識.yui < tests/read.txt

  compat-windows:
    name: Linux で書いたファイルを Windows の実装で読む
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: yui-linux
          path: from-linux

      - name: 作る
        run: .\build.bat

      - name: 読む
        run: type tests\read.txt | .\yui.exe from-linux\compat.yui
