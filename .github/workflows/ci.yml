# 結（yui）のテストを、push のたびに全部の土台で回します。
# public リポジトリなので、標準のランナーは無料です。
#
# ★土台ごとに違う挙動を捕まえるのが目的です。
#   実際にこれまで出たのは「Windows で UTF-8 のパスが開けない」
#   「Windows の argv は cp932 で来る」「wasm では排他が効かない」でした。
#   手元 1 台では出ません。
name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ枝に push が続いたら、古い回は止めます
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux（${{ matrix.cc }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: 作る
        run: make CC=${{ matrix.cc }}

      - name: テスト
        run: make test CC=${{ matrix.cc }}

      - name: テスト（AddressSanitizer / UBSan つき）
        run: make test-san CC=${{ matrix.cc }}

      - name: 土台をまたぐ比較用のファイルを作る
        if: matrix.cc == 'gcc'
        run: ./yui compat.yui < tests/compat.txt

      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc'
        with:
          name: yui-linux
          path: compat.yui
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 作る
        run: make

      - name: テスト
        run: make test

      - name: テスト（AddressSanitizer / UBSan つき）
        run: make test-san

  windows:
    name: Windows（MSVC）
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: 作る
        run: .\build.bat

      - name: テスト
        run: .\build.bat test

      # ★ここだけ pwsh です。cmd はバッチファイルをその時のコードページで
      #   読むので、日本語を引数に書くには chcp が要ります。pwsh は UTF-8 で
      #   読み、引数も UTF-16 のまま渡すので、測りたいもの（本体が引数を
      #   UTF-8 で受け取れるか）だけを測れます。
      - name: 日本語を引数で渡せること（★cp932 の罠）
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          .\yui.exe argv.yui "作る (人:田中)"
          if ($LASTEXITCODE -ne 0) { throw "作る が失敗しました（rc=$LASTEXITCODE）" }
          $out = .\yui.exe argv.yui "探す 田中" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "探す が失敗しました（rc=$LASTEXITCODE）" }
          Write-Host $out
          if ($out -notmatch "人:田中") { throw "引数で渡した日本語が通っていません" }

      # ★tests/cli.sh と同じことを見ています（あちらは sh が要るので Windows で動きません）。
      #   片方を直したら、もう片方も直してください。
      - name: CLI の終了コードと標準入力の読み方
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          # 終了コード
          .\yui.exe 2>$null | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "引数が無いとき 2 を返しません（rc=$LASTEXITCODE）" }
          .\yui.exe cli.yui "一覧 ()" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "成功で 0 を返しません（rc=$LASTEXITCODE）" }
          .\yui.exe cli.yui "これは誤り" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "失敗で 1 を返しません（rc=$LASTEXITCODE）" }
          # 誤りの行があっても止まらず、何行目かを出す
          "作る (点:一)`nこれは誤り`n作る (点:三)" | Set-Content -Path in1.txt -Encoding utf8NoBOM
          $err = (Get-Content in1.txt -Raw | .\yui.exe cli2.yui) 2>&1 | Out-String
          if ($err -notmatch "2 行目") { throw "何行目で失敗したかが出ていません: $err" }
          $left = (.\yui.exe cli2.yui "一覧 (点:) 名前だけ" | Out-String)
          if ($left -notmatch "点:一" -or $left -notmatch "点:三") {
            throw "誤りの行の前後が実行されていません: $left"
          }
          # NUL が入った行は、その行だけ飛ばして次へ進む
          $b = [Text.Encoding]::UTF8.GetBytes('作る (点:甲 {本文: "x')
          $b += 0
          $b += [Text.Encoding]::UTF8.GetBytes("y`"})`n作る (点:乙)`n")
          [IO.File]::WriteAllBytes("$PWD\in2.txt", $b)
          $err = (Get-Content in2.txt -Raw | .\yui.exe cli3.yui) 2>&1 | Out-String
          if ($err -notmatch "NUL") { throw "NUL だと言っていません: $err" }
          if ($err -notmatch "1 行目") { throw "NUL のある行が出ていません: $err" }
          $left = (.\yui.exe cli3.yui "一覧 (点:) 名前だけ" | Out-String)
          if ($left -notmatch "点:乙") { throw "NUL の次の行が巻き込まれています: $left" }
          Write-Host "CLI: 通りました"

      # ★入れ替え（rename）で失敗する道。ここでしか起こせません。
      #   Windows は「行き先を他のプロセスが掴んでいると置き換えられない」ので、
      #   削除を許さない形で開いたまま 詰め直す を打つと、入れ替えの段で失敗します。
      #   POSIX では、置き場を書けなくすると作業用のファイルを作る段で先に止まるため、
      #   入れ替えの段まで行けません（tests/cli.sh はそこまでを見ています）。
      - name: 詰め直す が入れ替えで失敗したとき、元のファイルが残ること
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          # ★ファイルを 2 つに分けます。1 つで両方 見ようとすると、
          #   同じプロセスの試しで書いたぶんが md5 の比較に混ざります（実測で踏みました）。
          #   また Get-FileHash は共有の指定が厳しいので、掴んでいる間は読めません。
          function 掴んで詰め直す($path, $stdin) {
            $h = [IO.File]::Open((Join-Path $PWD $path), 'Open', 'ReadWrite', 'ReadWrite')
            try {
              if ($stdin) { return (Get-Content $stdin -Raw | .\yui.exe $path) 2>&1 | Out-String }
              return (.\yui.exe $path "詰め直す") 2>&1 | Out-String
            } finally { $h.Close() }
          }
          foreach ($f in @("a.yui", "b.yui")) {
            .\yui.exe $f "作る (人:田中)" | Out-Null
            .\yui.exe $f "作る (人:佐藤)" | Out-Null
            .\yui.exe $f "消す (人:佐藤)" | Out-Null
          }
          # (1) 失敗しても元のファイルが残り、作業用の .詰 も残らないこと
          $before = (Get-FileHash a.yui -Algorithm MD5).Hash
          $err = 掴んで詰め直す "a.yui" $null
          $rc = $LASTEXITCODE
          if ($rc -ne 1) { throw "入れ替えの失敗で 1 を返しません（rc=$rc）" }
          if ($err -notmatch "入れ替えられません") { throw "入れ替えられないと言いません: $err" }
          if (Test-Path "a.yui.詰") { throw "作業用の .詰 が残っています" }
          if ($before -ne (Get-FileHash a.yui -Algorithm MD5).Hash) {
            throw "失敗したのに元のファイルが変わりました"
          }
          # (2) ★同じプロセスの中でも立て直せること。別のプロセスで見ると、
          #     次のプロセスが開き直すので、立て直しを壊しても通ってしまいます。
          "詰め直す`n一覧 (人:) 名前だけ`n作る (人:鈴木)" |
            Set-Content -Path bin.txt -Encoding utf8NoBOM
          $same = 掴んで詰め直す "b.yui" "bin.txt"
          if ($same -notmatch "人:田中") { throw "同じプロセスで失敗のあと読めません: $same" }
          if ($same -notmatch "人:鈴木") { throw "同じプロセスで失敗のあと書けません: $same" }
          $left = (.\yui.exe b.yui "一覧 (人:) 名前だけ" | Out-String)
          if ($left -notmatch "人:鈴木") { throw "書いたものが残っていません: $left" }
          Write-Host "詰め直す の入れ替えの失敗: 通りました"

      # ★--read / --wait / --json は tests/cli.sh が見ていますが、sh が要るので
      #   Windows では動きません。ここでは同じことを pwsh で見ます。
      #   ★--read は Windows では別の道を通ります（LockFileEx を排他の印なしで
      #     呼ぶ＝共有の錠）。POSIX の flock(LOCK_SH) とは別の実装なので、
      #     ここで通さないと「Windows では効くのか」が誰にも分かりません。
      - name: CLI の --read / --wait / --json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          .\yui.exe rw.yui "作る (人:田中 {役職: `"部長`"})" | Out-Null

          # --read で読める。★<パス>.錠 は作らない（短命なプロセスなので）
          $out = (.\yui.exe --read rw.yui "一覧 (人:) 名前だけ" | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "--read で読めません: $out" }
          if ($out -notmatch "人:田中") { throw "--read の結果が違います: $out" }
          if (Test-Path "rw.yui.錠") { throw "CLI が <パス>.錠 を作っています" }

          # --read では書けない
          $out = (.\yui.exe --read rw.yui "作る (人:新顔)" 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) { throw "--read で書けてしまいました: $out" }
          if ($out -notmatch "読むだけで開いています") { throw "断る理由が違います: $out" }

          # --read と --json を一緒に使える
          $out = (.\yui.exe --read --json rw.yui "一覧 (人:) 名前だけ" | Out-String)
          if ($out -notmatch '"kind":"node"') { throw "--read --json が効きません: $out" }

          # --wait を付けても、塞がっていなければそのまま書ける
          $out = (.\yui.exe --wait 5 rw.yui "作る (人:待った)" | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "--wait で書けません: $out" }

          # ★知らない旗は断る（通すとファイル名として扱われ、その名前の
          #   新しいファイルが黙って作られます）
          $out = (.\yui.exe --jsn rw.yui "一覧 ()" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 2) { throw "知らない旗の終了コードが 2 ではありません: $out" }
          if ($out -notmatch "知らない旗です") { throw "知らない旗だと言いません: $out" }
          if (Test-Path "--jsn") { throw "綴り違いの旗がファイルになっています" }
          $global:LASTEXITCODE = 0
          Write-Host "CLI の --read / --wait / --json: 通りました"

      # ★tests/daemon.sh は sh が要るので Windows では動きません。ここでは
      #   同じ道具（tests/yuid_say.c）を使って、要点だけを見ます。
      #   見ているもの: 立つ・錠を作る・読める・書き込みを断る・2 本 目は立たない・
      #   止めると錠が外れる。細かいところは daemon.sh が POSIX で見ています。
      - name: デーモン（段 1）が Windows で動くこと
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\yui.exe d.yui "作る (人:田中 {役職: `"部長`"})" | Out-Null
          $p = Start-Process -FilePath ".\yuid.exe" `
            -ArgumentList "d.yui","--port","39240","--idle","60" `
            -PassThru -RedirectStandardError "yuid.err" -NoNewWindow
          # 待ち受けの 1 行が出るまで待ちます（決め打ちの sleep にしません）
          $i = 0
          while ($i -lt 100) {
            if ((Test-Path "yuid.err") -and (Get-Content "yuid.err" -Raw) -match "で待っています") { break }
            if ($p.HasExited) { break }
            Start-Sleep -Milliseconds 100; $i++
          }
          $log = if (Test-Path "yuid.err") { Get-Content "yuid.err" -Raw } else { "" }
          if ($log -notmatch "で待っています") { throw "デーモンが立ちません: $log" }
          if (-not (Test-Path "d.yui.錠")) { throw "錠を作っていません" }
          if ((Get-Content "d.yui.錠" -Raw) -notmatch "yuid") { throw "錠に名乗りがありません" }

          # ★錠で断られたときの終了コードが 3 であること（Windows ではここでしか見られません。
          #   デーモンが錠を握っているこの間だけが、塞がった状態を作れる所です）
          # ★対照を一緒に取ります。**全部が 3 なら「見分けた」ことにならない**ので。
          .\yui.exe d.yui "一覧 ()" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "錠で断られたときの終了コードが 3 ではありません: $LASTEXITCODE" }
          .\yui.exe free.yui "でたらめ" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "文法の誤りの終了コードが 1 ではありません: $LASTEXITCODE" }
          .\yui.exe --jsn d.yui "一覧 ()" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "知らない旗の終了コードが 2 ではありません: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          $out = (.\yuid_say.exe 39240 "一覧 ()" | Out-String)
          if ($out -notmatch '"name":"田中"') { throw "読めません: $out" }
          if ($out -notmatch '"役職":"部長"') { throw "属性が返りません: $out" }
          if ($out -notmatch '"kind":"end","rc":0') { throw "締めの行がありません: $out" }

          $out = (.\yuid_say.exe 39240 "作る (人:新顔)" | Out-String)
          if ($out -notmatch "読むだけで開いています") { throw "書き込みを断りません: $out" }

          # ★同じ接続で 2 回（持続接続）
          $out = (.\yuid_say.exe 39240 "一覧 (人:)" "手引き" | Out-String)
          if (($out | Select-String -AllMatches '"kind":"end"').Matches.Count -ne 2) {
            throw "持続接続で 2 回 返っていません: $out"
          }

          # ★返りの上限（別のファイル・別のポートで。同じファイルには
          #   2 本 立てられません——先の 1 本が錠を持っているので）
          .\yui.exe cap.yui "作る (人:甲)" | Out-Null
          .\yui.exe cap.yui "作る (人:乙)" | Out-Null
          .\yui.exe cap.yui "作る (人:丙)" | Out-Null
          $c = Start-Process -FilePath ".\yuid.exe" `
            -ArgumentList "cap.yui","--port","39242","--idle","60","--max-rows","2" `
            -PassThru -RedirectStandardError "cap.err" -NoNewWindow
          $i = 0
          while ($i -lt 100) {
            if ((Test-Path "cap.err") -and (Get-Content "cap.err" -Raw) -match "で待っています") { break }
            if ($c.HasExited) { break }
            Start-Sleep -Milliseconds 100; $i++
          }
          $caplog = if (Test-Path "cap.err") { Get-Content "cap.err" -Raw } else { "" }
          if ($caplog -notmatch "2 行まで") { throw "上限つきのデーモンが立ちません: $caplog" }
          $out = (.\yuid_say.exe 39242 "一覧 (人:) 名前だけ" | Out-String)
          if ($out -notmatch '"cut":true') { throw "上限で打ち切っていません: $out" }
          if ($out -notmatch "打ち切りました") { throw "打ち切ったと言っていません: $out" }
          if (($out | Select-String -AllMatches '"kind":"node"').Matches.Count -ne 2) {
            throw "上限の行数だけ返していません: $out"
          }
          Stop-Process -Id $c.Id
          Remove-Item "cap.yui.錠" -ErrorAction SilentlyContinue

          # ★2 本 目は立たないこと（Windows の SO_REUSEADDR は 2 つ目を通すので、
          #   SO_EXCLUSIVEADDRUSE が効いているかを見る段でもあります）
          $second = (.\yuid.exe d.yui --port 39240 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 3) { throw "2 本 目が「ほかが先に持っている（3）」で終わっていません: $LASTEXITCODE / $second" }
          if ($second -match "で待っています") { throw "2 本 目が待ち受けを始めました: $second" }
          # ★pwsh の段の終了コードは「最後に走った実行ファイルの終了コード」に
          #   なります。いま意図して yuid.exe を失敗させたので、そのままだと
          #   全部 通っても exit 1 で落ちます（実測）。ここで打ち消します。
          #   ★末尾に exit 0 を置く形にはしません。そうすると、このあとで
          #     実行ファイルが落ちても拾えなくなります（安全網を外さない）。
          $global:LASTEXITCODE = 0

          Stop-Process -Id $p.Id
          $i = 0
          while ($i -lt 100 -and (Test-Path "d.yui.錠")) { Start-Sleep -Milliseconds 100; $i++ }
          # ★Stop-Process は合図を送らずに落とすので、錠は残ります。それが正しい姿
          #   （落ちた持ち主の錠は残り、壊すかは使う側が決める）。ここではその確認です。
          if (-not (Test-Path "d.yui.錠")) { throw "落とされた持ち主の錠が消えています（残るのが正しい）" }
          Remove-Item "d.yui.錠"
          Write-Host "デーモン（段 1）: 通りました"

      - name: 土台をまたぐ比較用のファイルを作る
        run: type tests\compat.txt | .\yui.exe compat.yui

      - uses: actions/upload-artifact@v4
        with:
          name: yui-windows
          path: compat.yui
          if-no-files-found: error

  wasm:
    name: wasm（emscripten）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: emsdk を入れる
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install latest
          ./emsdk activate latest

      - name: テスト
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          make test-wasm

  compat:
    name: 土台をまたいでバイトまで同じか
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: yui-linux
          path: from-linux

      - uses: actions/download-artifact@v4
        with:
          name: yui-windows
          path: from-windows

      - name: 大きさと md5 を出す
        run: |
          ls -l from-linux/compat.yui from-windows/compat.yui
          md5sum from-linux/compat.yui from-windows/compat.yui

      - name: バイトを突き合わせる
        run: cmp from-linux/compat.yui from-windows/compat.yui

      # 日本語のファイル名も一緒に確かめます（README の例が 知識.yui なので）
      - name: Windows で書いたファイルを Linux の実装で読む
        run: |
          make
          cp from-windows/compat.yui 知識.yui
          ./yui 知識.yui < tests/read.txt

  compat-windows:
    name: Linux で書いたファイルを Windows の実装で読む
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: yui-linux
          path: from-linux

      - name: 作る
        run: .\build.bat

      - name: 読む
        run: type tests\read.txt | .\yui.exe from-linux\compat.yui
